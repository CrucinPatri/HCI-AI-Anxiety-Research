<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetMatch - Studiu UX & AI</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #faf7f2; color: #4a4a4a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; }
        .card { max-width: 500px; background: #ffffff; padding: 35px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
        h2 { color: #1e293b; margin-top: 0; }
        p { font-size: 0.92rem; line-height: 1.6; color: #64748b; }
        .btn-start { background: #0284c7; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🐾 Bine ai venit pe PetMatch!</h2>
        <p>Vei testa o interfață de adopție asistată de AI. Analizează opțiunea prezentată și decide dacă dorești să trimiți cererea de adopție sau să renunți.</p>
        <p><strong>La final vei fi redirecționat automat către un scurt chestionar de feedback (1 minut).</strong></p>
        <button class="btn-start" onclick="startTest()">Începe Experimentul</button>
    </div>

    <script>
        function startTest() {
            const pages = [
                'prototypes/scenario_a.html',
                'prototypes/scenario_b.html',
                'prototypes/scenario_c.html'
            ];
            window.location.href = pages[Math.floor(Math.random() * pages.length)];
        }
    </script>
</body>
</html>
